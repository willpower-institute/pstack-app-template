# CodeQL — วิเคราะห์โค้ดหาช่องโหว่ (SQL injection, path traversal, hardcoded secret ฯลฯ)
# ฟรีสำหรับ public repo · private repo ต้องมี GitHub Advanced Security (GHAS)
#
# ตั้งใจแยกออกจาก workflow CI และ **ไม่ได้อยู่ใน gate 'ci'**
# เพราะใช้เวลานานกว่าและรันตามตารางด้วย — ไม่ควรบล็อกทุก PR
#
# ⚠️ private repo ที่ยังไม่เปิด GHAS: การ upload ผล CodeQL จะล้มด้วย
# "Resource not accessible by integration" ทั้งที่ analyze รันจบ — ทำให้เห็นกากบาทแดง
# ถาวรทุก push (แม้ไม่บล็อก gate ci) ซึ่งกลบสัญญาณจริง · job นี้จึง **ข้ามอัตโนมัติบน
# private repo** และรันเฉพาะ public · ถ้า private อยากได้ CodeQL ให้เปิด GHAS ก่อน
# แล้วลบเงื่อนไข if ออก
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # ทุกวันจันทร์ 03:00 UTC — จับช่องโหว่ที่ query ใหม่ของ CodeQL เพิ่งรู้จัก
    - cron: "0 3 * * 1"

permissions:
  contents: read
  security-events: write   # ต้องมีเพื่อส่งผลขึ้นแท็บ Security

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    # ข้าม private repo ที่ไม่มี GHAS (upload จะล้ม) — public รันเต็มตามปกติ
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v4
